name: PMCR-O Checker
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checker:
    name: Catalog, provider gates and control plane
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out reviewed Marketplace Agent
        uses: actions/checkout@v4
        with:
          repository: pmcro-marketplace/marketplace-agent
          ref: 5a384a33fed247fb2b85b177ccb9b6ca3901c36c
          path: .provider/marketplace-agent
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check authored catalogs and fail-closed provider gates
        env:
          PMCRO_MARKETPLACE_PROVIDER_CHECKOUT: ${{ github.workspace }}/.provider/marketplace-agent
        run: |
          python -B eng/marketplaces/test_validate.py
          python -B eng/marketplaces/test_resolve.py
          python -B eng/marketplaces/validate.py
          git -C "$PMCRO_MARKETPLACE_PROVIDER_CHECKOUT" rev-parse HEAD
          (cd "$PMCRO_MARKETPLACE_PROVIDER_CHECKOUT" && python -B -m unittest discover -s tests -v)
      - name: Check control plane
        run: |
          npm install --ignore-scripts --no-package-lock --no-audit --no-fund --legacy-peer-deps
          npm run lint
          npm run build
          node --import tsx --test src/utils/*.test.ts
      - name: Checker evidence summary
        run: |
          printf '%s\n' '## PMCR-O Checker' 'Catalog structure, pinned provider gates, TypeScript, build and regression tests passed.' 'A catalog-only PMCR-O cycle persisted and reopened ten correlated frames in an isolated test project.' 'No private operator state was uploaded; no external provider or independent host agent was invoked by the catalog-only cycle. Approval was not issued.' >> "$GITHUB_STEP_SUMMARY"
